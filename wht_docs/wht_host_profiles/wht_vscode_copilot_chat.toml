  "never accept the 'Enable global auto approve?' modal, and never seed `chat.tools.global.autoApprove.optIn` -- that single one-time acceptance is what makes the native bypass execute unattended, as the positive control shows",
  "keep `chat.tools.terminal.autoApprove.warningAccepted` unset",
  "retain the per-session chat transcripts under `<user-data-dir>/User/workspaceStorage/<hash>/chatSessions/` -- they are the audit trail this profile's DETECT classification rests on",
]
enterprise_policy_recommended = [
  "ChatToolsAutoApprove -> disable global tool auto-approval",
  "ChatToolsTerminalEnableAutoApprove -> disable terminal auto-approval",
  "ChatToolsEligibleForAutoApproval -> mark the terminal and edit tools ineligible",
  "ChatAgentSandboxEnabled -> require the agent sandbox",
  "ChatAgentSandboxAllowUnsandboxedCommands -> forbid unsandboxed commands",
