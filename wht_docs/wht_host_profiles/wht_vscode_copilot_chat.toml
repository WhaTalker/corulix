[required_configuration]
summary = "Two layers. The settings layer is necessary but insufficient on its own; the enterprise policy layer is what makes the control outrank the actor it constrains, and it is RECOMMENDED rather than certified because it was not exercised here."
workspace_mcp_json = """
{
  "servers": {
    "corulix": {
      "type": "stdio",
      "command": "<corulix-bin>",
      "args": ["mcp", "stdio", "--workspace", "<workspace>"]
    }
  }
}"""
certified_settings_example_note = "RECOMMENDED, NOT FULLY CERTIFIED. The `chat.tools.global.autoApprove` and `chat.tools.terminal.enableAutoApprove` entries are backed by executed behaviour. The `chat.tools.eligibleForAutoApproval` entry and the four `chat.agent.sandbox.*` entries are recommendations whose runtime effect was NOT established -- see known_limitations -- and three of them were shown to be overridable by a workspace document; see host_config_downgrade_path."
